# Mirrors the foot setup: gruvbox dark hard, 100k scrollback, TERM=xterm-256color
# so tmux's ",xterm-256color:Tc" override and remote hosts work without extra terminfo.

[env]
TERM = "xterm-256color"

[font]
normal = { family = "monospace" }
size = 11

[scrolling]
history = 100000

[mouse]
hide_when_typing = true

[colors.primary]
background = "#1d2021"
foreground = "#ebdbb2"

[colors.normal]
black = "#1d2021"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
magenta = "#b16286"
cyan = "#689d6a"
white = "#a89984"

[colors.bright]
black = "#928374"
red = "#fb4934"
green = "#b8bb26"
yellow = "#fabd2f"
blue = "#83a598"
magenta = "#d3869b"
cyan = "#8ec07c"
white = "#ebdbb2"
